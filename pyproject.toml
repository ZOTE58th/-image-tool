[project]
name = "imgtool"
version = "0.1.0"
description = "A command line tool that reads image metadata and performs simple edits."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0",
]

[project.scripts]
imgtool = "imgtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imgtool"]
